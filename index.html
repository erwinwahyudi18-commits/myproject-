  let player='Kanca',coins=0,missionTargets=[],missionIndex=0,missionDone=false,records=[],sheetReady=false,loadTimer,storageMessage='Nyambung menyang Canva Sheet…',adminReady=false,adminUnlock=false,adminBusy=false,exampleAnswered=false;
  const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
  const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};

  const total=()=>scores.reduce((a,b)=>a+b,0),levelScore=i=>scores[2*i]+scores[2*i+1],done=i=>finished[2*i]&&finished[2*i+1],keys=()=>[0,1,2].filter(done).length;
  const finalStars=score=>score===600?5:score>=550?4:score>=500?3:score>=400?2:score>=300?1:0;
  const unlocked=i=>adminUnlock||i===0||i===1&&levelScore(0)>=140||i===2&&levelScore(0)+levelScore(1)>=280;
  const gameTwoOpen=i=>adminUnlock||finished[2*i];

  names.forEach(n=>addSlot('letter-'+n,'Swara Aksara '+n));
  const pageMusic=[['music-title','Musik Latar Sampul'],['music-goals','Musik Latar Tujuan'],['music-map','Musik Latar Peta'],['music-level-1','Musik Latar Level 1'],['music-level-2','Musik Latar Level 2'],['music-level-3','Musik Latar Level 3'],['music-scoreboard','Musik Latar Papan Skor']];
  const pageVoices=[['voice-cover','Swara Sampul'],['voice-goals','Swara Tujuan'],['voice-map','Swara Peta'],['voice-material-1','Swara Materi Level 1'],['voice-example-1','Swara Tuladha Level 1'],['voice-result-1','Swara Asil Level 1'],['voice-material-2','Swara Materi Level 2'],['voice-example-2','Swara Tuladha Level 2'],['voice-result-2','Swara Asil Level 2'],['voice-material-3','Swara Materi Level 3'],['voice-example-3','Swara Tuladha Level 3'],['voice-result-3','Swara Asil Level 3'],['voice-final','Swara Asil Akhir'],['voice-scoreboard','Swara Papan Skor'],['voice-mission','Swara Misi'],['voice-treasure','Swara Kamar Bandha'],['voice-guide','Swara Pandhuan']];
  pageMusic.concat(pageVoices).forEach(([id,label])=>addSlot(id,label));

};
  const media={
    context:null,active:null,music:null,musicId:null,musicOn:true,musicVolume:35,voiceVolume:70,started:false,failed:false,ducked:false,

    unavailable(){if(!this.failed){this.failed=true;notice('Swara ora kasedhiya ing versi publikasi. Pasang maneh file swara liwat konfigurasi Canva Code.')}},
    start(){try{const ctx=this.ctx();this.started=true;this.failed=false;this.background();return true}catch{return this.unavailable(),false}},
    restoreMusic(){if(this.started&&this.musicOn&&!this.music)this.background()},

    ctx(){if(!this.context){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error('AudioContext ora kasedhiya');this.context=new AudioContextClass()}if(this.context.state==='suspended'){const resume=this.context.resume();if(resume&&typeof resume.catch==='function')resume.catch(()=>this.unavailable())}return this.context},

  this.stopVoice();

  const slot = slots.get(id);

  // Jika audio dipasang melalui setelan game, gunakan audio itu.

    try {
      const ctx = this.ctx();
      const source = ctx.createBufferSource();
      const gain = ctx.createGain();

      source.buffer = slot.buffer;
      gain.gain.value = this.voiceVolume / 100;
      source.connect(gain).connect(ctx.destination);

      source.onended = () => {

      this.active = source;
      source.start();
      return true;
    } catch {

    }

      audio.preload = 'auto';

      this.active = audio;

  function settingsMarkup(){
    return `<label class="block mt-3" for="music-volume">Banter Musik: <output id="music-number">${media.musicVolume}%</output></label>
    <input id="music-volume" class="w-full" type="range" min="0" max="100" value="${media.musicVolume}">
    <label class="block mt-3" for="voice-volume">Banter Swara: <output id="voice-number">${media.voiceVolume}%</output></label>
    <input id="voice-volume" class="w-full" type="range" min="0" max="100" value="${media.voiceVolume}">
    <section class="slot mt-6" aria-labelledby="admin-title"><h3 id="admin-title">Pangurus</h3>
    <label class="block mt-2 font-bold" for="admin-password">Tembung rahasia pangurus</label>
    <input id="admin-password" class="field mt-2" type="password" autocomplete="off">
    <div class="actions"><button class="btn small" type="button" data-media-action="admin-login">Mlebu</button></div>
    <div id="admin-controls" class="actions" ${adminReady?'':'hidden'}>
    <button class="btn small" type="button" data-media-action="unlock">Level 2 lan 3: Bukak/Tutup</button>
    <button class="btn small" type="button" data-media-action="reset-ask">Resiki Papan Nilai</button></div>
    <div id="reset-confirm" class="mt-3" hidden><p>Tenan arep mbusak kabeh cathetan ing papan nilai?</p>
    <div class="actions"><button class="btn small" type="button" data-media-action="reset-confirm">Ya, busak cathetan</button>
    <button class="btn small" type="button" data-media-action="reset-cancel">Ora, bali</button></div></div></section>`
  }
  function showOverlay(type){
    media.stopVoice();overlay.hidden=false;
    document.getElementById('overlay-title').textContent=type==='exit'?'Metu saka petualangan?':'Setelan Swara lan Dolanan';
    message('');
    content.innerHTML=type==='exit'?'<p>Bali menyang sampul utawa terus dolanan?</p><div class="actions"><button class="btn gold" type="button" data-media-action="exit-yes">Bali menyang Sampul</button><button class="btn" type="button" data-media-action="exit-no">Terus Dolanan</button></div>':settingsMarkup();
    document.getElementById('overlay-close').focus()
  }
  function closeOverlay(){media.stopVoice();overlay.hidden=true;document.getElementById('settings-shortcut').focus()}
  function back(){
    if(!overlay.hidden){closeOverlay();return}
    if(screen==='game')navigate('example');else if(screen==='example')navigate('material');else if(screen==='material')navigate('map');else if(screen==='map')navigate('goals');else if(screen==='goals')navigate('cover');else navigate('map')
  }
  async function resetRanking(control){
    if(!sheetReady){message('Cathetan durung bisa diwaca. Coba sambungake maneh.');return}
    control.disabled=true;const rows=records.slice();let failed=false;
    try{
      for(const row of rows){const result=await window.dataSdk.delete(row);if(!result.isOk){failed=true;break}}
      message(failed?'Ora bisa mesthekake kabeh cathetan wis kabusak. Priksa Canva Sheet sadurunge nyoba maneh.':'Papan asil wis direset');
      if(!failed)records=[];if(screen==='scoreboard'||screen==='final')render()
    }catch{message('Ora bisa mesthekake kabeh cathetan wis kabusak. Priksa Canva Sheet sadurunge nyoba maneh.')}
    finally{control.disabled=false;document.getElementById('reset-confirm').hidden=true;document.getElementById('admin-controls').hidden=true;adminReady=false;adminBusy=false}
  }
  view.addEventListener('click',async e=>{
    const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
    const a=b.dataset.action;
    if(a==='start-playing'){media.start();navigate('goals')}
    else if(['cover','goals','map','material','final','guide','scoreboard'].includes(a))navigate(a);
    else if(a==='exit')showOverlay('exit');
    else if(a==='level'){const i=Number(b.dataset.index);if(unlocked(i)){level=i;game=0;navigate('material')}}
    else if(a==='bypass'){if(adminUnlock){level=Number(b.dataset.index);game=1;exampleAnswered=false;navigate('example')}}
    else if(a==='first-example'||a==='second-example'){if(a==='second-example'&&!gameTwoOpen(level))return;game=a==='first-example'?0:1;exampleAnswered=false;navigate('example')}
    else if(a==='letter'){const n=b.dataset.name;document.getElementById('material-status').textContent='Aksara '+n+(media.play('letter-'+n)?' · Swara lagi diputer.':' · Swara durung dipasang.')}
    else if(a==='example-answer'){
      if(exampleAnswered)return;exampleAnswered=true;
      const {target,ids}=exampleData(),index=Number(b.dataset.index),correct=level===2?same(ids[index],target):ids[index]===target;
      view.querySelectorAll('[data-action="example-answer"]').forEach(x=>x.disabled=true);
      b.classList.add('selected');
      document.getElementById('example-feedback').textContent=correct?'Apik! Tuladha wis bener. Saiki ayo miwiti soal.':'Durung pas. Tuladha ora ngowahi skor. Delengen materi maneh.';
      media.play(correct?'correct':'wrong')
    }
    else if(a==='start-game')startGame();
    else if(a==='answer'){const index=Number(b.dataset.index);if(Number.isInteger(index)&&index>=0&&index<options.length)resolveAnswer(index)}
    else if(a==='advance'){if(answered){b.disabled=true;await advance()}}
    else if(a==='restart-game'){exampleAnswered=false;navigate('example')}
    else if(a==='next-game'){if(game===0&&gameTwoOpen(level)){game=1;exampleAnswered=false;navigate('example')}else if(game===1)navigate('levelResult')}
    else if(a==='next-level'){if(level===2)navigate('final');else if(unlocked(level+1)){level++;game=0;navigate('material')}}
    else if(a==='new-game'){b.disabled=true;startNewGame()}
    else if(a==='mission-answer'){
      if(b.dataset.name!==missionTargets[missionIndex]){document.getElementById('mission-feedback').textContent='Durung pas. Coba maneh.';media.play('wrong');return}
      missionIndex++;media.play('correct');
      if(missionIndex===3){missionDone=true;coins+=3;navigate('treasure');await save()}
      else{render();document.getElementById('mission-feedback').textContent='Apik! Saiki goleki aksara sabanjure.'}
    }
  });
  view.addEventListener('change',e=>{if(e.target.id==='nickname'){player=e.target.value.trim().slice(0,24)||'Kanca';e.target.value=player;hud()}});
  document.getElementById('back').addEventListener('click',back);
  document.getElementById('settings-shortcut').addEventListener('click',()=>showOverlay('settings'));
  document.getElementById('music-toggle').addEventListener('click',e=>{if(!media.started)media.start();else{media.musicOn=!media.musicOn;if(!media.musicOn)media.stopMusic();else media.restoreMusic()}e.currentTarget.textContent=media.musicOn?'Musik: Urip':'Musik: Mati';e.currentTarget.setAttribute('aria-pressed',String(media.musicOn))});
  document.getElementById('overlay-close').addEventListener('click',closeOverlay);
  content.addEventListener('input',e=>{
    if(e.target.dataset.transcript){slots.get(e.target.dataset.transcript).transcript=e.target.value;return}
    if(e.target.id==='music-volume'||e.target.id==='voice-volume'){
      const music=e.target.id==='music-volume',n=Number(e.target.value);
      if(music)media.musicVolume=n;else media.voiceVolume=n;
      document.getElementById(music?'music-number':'voice-number').textContent=n+'%';
      if(music)media.background()
    }
  });
  content.addEventListener('change',e=>{const id=e.target.dataset.fileSlot;if(id&&e.target.files?.[0])media.assign(id,e.target.files[0])});
  content.addEventListener('click',async e=>{
    const b=e.target.closest('[data-media-action]');if(!b)return;
    const a=b.dataset.mediaAction,id=b.dataset.id;
    if(a==='exit-yes'){closeOverlay();navigate('cover')}
    else if(a==='exit-no')closeOverlay();
    else if(a==='preview'){if(id.startsWith('music')){media.background();if(!media.music)message('Swara durung dipasang.')}else if(!media.play(id))message('Swara durung dipasang.')}
    else if(a==='stop-audio')media.stopAll();
    else if(a==='replace')content.querySelector(`[data-file-slot="${id}"]`)?.click();
    else if(a==='remove')media.remove(id);
    else if(a==='retry-sheet')initSheet();
    else if(a==='toggle-music-panel'){const panel=document.getElementById('music-panel');panel.hidden=!panel.hidden}
    else if(a==='toggle-voice-panel'){const panel=document.getElementById('voice-panel');panel.hidden=!panel.hidden}
    else if(a==='admin-login'){const input=document.getElementById('admin-password');if(input?.value==='NAYA'){adminReady=true;input.value='';message('Pilih siji tumindak pangurus.');document.getElementById('admin-controls').hidden=false}else{adminReady=false;if(input)input.value='';message('Tembung rahasia salah')}}
    else if(a==='unlock'&&adminReady&&!adminBusy){
      adminBusy=true;adminUnlock=!adminUnlock;adminReady=false;document.getElementById('admin-controls').hidden=true;
      message(adminUnlock?'Level 2 lan 3 wis kabukak':'Level 2 lan 3 wis dikunci');
      if(screen==='map'||screen==='material')render();adminBusy=false
    }
    else if(a==='reset-ask'&&adminReady&&!adminBusy){document.getElementById('reset-confirm').hidden=false}
    else if(a==='reset-cancel'){document.getElementById('reset-confirm').hidden=true;adminBusy=false}
    else if(a==='reset-confirm'&&adminReady&&!adminBusy)await resetRanking(b)
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')back()});
  window.addEventListener('pagehide',()=>{clearTimers();media.stopAll()});
  render();initSheet();
})();
</script>
 
</body></html>
