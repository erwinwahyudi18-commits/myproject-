<script>
'use strict';
const GITHUB_BASE='https://raw.githubusercontent.com/erwinwahyudi18-commits/myproject-/main/';
const asset=name=>GITHUB_BASE+encodeURIComponent(name);
function aksaraView(g,extraClass='script'){
 // Ra lan Da nggunakake gambar asli saka repositori supaya wujude cocog karo aset sekolah.
 // CSS ing ngisor nyawijikake latar JPG karo latar kaca lan nyepetake pinggir gambar.
 if(g==='ꦫ' || g==='ꦢ'){
   const file=g==='ꦫ'?'gambarra.jpg':'gambarda.jpg';
   const label=g==='ꦫ'?'Aksara Ra':'Aksara Da';
   return `<img class="aksara-gambar aksara-ra-da ${extraClass}" src="${asset(file)}" alt="${label}" loading="eager" decoding="async">`;
 }
 return `<span class="${extraClass} aksara-unicode">${g}</span>`;
}
// Level 3 tetep nggunakake gambar asli saka GitHub kanggo Ra lan Da.
// Ukuran lan tampilan gambar diseragamake nganggo CSS khusus ing pungkasan stylesheet.
function aksaraViewLevel3(g,extraClass='script'){
 return aksaraView(g,extraClass);
}
function aksaraLineViewLevel3(text){
 return Array.from(String(text)).map(ch=>
  aksara.some(a=>a[0]===ch)?aksaraViewLevel3(ch,'script smallscript'):`<span class="script smallscript aksara-unicode">${ch}</span>`
 ).join('');
}
function aksaraLineView(text){
 return Array.from(String(text)).map(ch=>
  aksara.some(a=>a[0]===ch)?aksaraView(ch,'script smallscript'):`<span class="script smallscript aksara-unicode">${ch}</span>`
 ).join('');
}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let sharedLeaderboard=null;
function getLeaderboard(){try{return JSON.parse(localStorage.getItem('sc_leaderboard')||'[]')}catch(e){return []}}
function recordLeaderboard(){
 const board=getLeaderboard();
 const result={name:state.name.trim()||'Tanpa Jeneng',total:total(),stars:reward(),date:new Date().toISOString()};
 const old=board.findIndex(x=>String(x.name).toLowerCase()===result.name.toLowerCase());
 if(old>=0){if(Number(board[old].total)>result.total)return;board.splice(old,1)}
 board.push(result);board.sort((a,b)=>Number(b.total)-Number(a.total));
 localStorage.setItem('sc_leaderboard',JSON.stringify(board.slice(0,60)));
}
function trophyForRank(rank){return rank===1?'🥇 Piala Emas':rank===2?'🥈 Piala Perak':rank===3?'🥉 Piala Perunggu':'-'}
function currentPlayerRank(){const board=getLeaderboard();const ix=board.findIndex(x=>String(x.name).toLowerCase()===String(state.name).trim().toLowerCase());return ix<0?0:ix+1}
function leaderboardHTML(){
 const board=sharedLeaderboard || getLeaderboard().map((x,i)=>({nama:x.name,skor:x.total,bintang:x.stars,peringkat:i+1,piala:i<3?3-i:0}));
 const sorted=[...board].sort((a,b)=>Number(b.skor??b.total??0)-Number(a.skor??a.total??0));
 return `<h2>Papan Skor Akhir</h2><div class="leaderboard-wrap" role="region" aria-label="Daftar papan skor" tabindex="0"><table class="leaderboard"><thead><tr><th>No.</th><th>Jeneng Siswa</th><th>Skor</th><th>Peringkat</th><th>Lintang</th><th>Piala</th></tr></thead><tbody>${Array.from({length:60},(_,i)=>{const x=sorted[i],rank=x?Number(x.peringkat)||i+1:'-',stars=x?Number(x.bintang??x.stars)||0:0,cup=x?(Number(x.piala)===3?'🥇 Piala Emas':Number(x.piala)===2?'🥈 Piala Perak':Number(x.piala)===1?'🥉 Piala Perunggu':(i===0?'🥇 Piala Emas':i===1?'🥈 Piala Perak':i===2?'🥉 Piala Perunggu':'-')):'-';return `<tr><td>${x?i+1:'-'}</td><td>${x?escapeHTML(x.nama??x.name??'-'):'-'}</td><td>${x?(x.skor??x.total??'-'):'-'}</td><td>${x?'Juara '+rank:'-'}</td><td>${x?(stars?'⭐ '.repeat(stars):'0'):'-'}</td><td>${cup}</td></tr>`}).join('')}</tbody></table></div>`;
}
function showLeaderboard(){sharedLeaderboard=null;show(`${leaderboardHTML()}<div class="center"><button class="btn danger" onclick="clearLeaderboard()">🗑 Busak Papan Skor</button><button class="btn gold" onclick="go('map')">↩ Mbalik Peta</button></div>`,'leaderboard');playBg('menuutama.mp3');loadSharedLeaderboard()}
function normalizeSharedScores(data){
 const rows=Array.isArray(data?.scores)?data.scores:(Array.isArray(data?.ranking)?data.ranking:[]);
 const bestByName=new Map();
 rows.forEach((x,i)=>{
  const name=String(x?.nama??x?.name??x?.studentName??'').trim();
  if(!name)return;
  const score=Number(x?.skor??x?.score??x?.total??x?.totalScore??0)||0;
  const stars=Number(x?.bintang??x?.stars??0)||0;
  const old=bestByName.get(name.toLocaleLowerCase());
  if(!old||score>old.skor)bestByName.set(name.toLocaleLowerCase(),{
   nama:name,skor:score,bintang:stars,peringkat:0,piala:0
  });
 });
 return [...bestByName.values()].sort((a,b)=>b.skor-a.skor).slice(0,60).map((x,i)=>({
  ...x,peringkat:i+1,piala:i<3?3-i:0
 }));
}
function loadSharedLeaderboard(){
 const callbackName='siCakrawalaRanking_'+Date.now()+'_'+Math.floor(Math.random()*100000);
 const script=document.createElement('script');
 let finished=false;
 const cleanup=()=>{if(finished)return;finished=true;try{delete window[callbackName]}catch(e){window[callbackName]=undefined}if(script.parentNode)script.parentNode.removeChild(script)};
 window[callbackName]=function(result){
  if(result&&result.ok&&(Array.isArray(result.scores)||Array.isArray(result.ranking))){
   sharedLeaderboard=normalizeSharedScores(result);
   if(state.page==='final'||state.page==='leaderboard'){
    const holder=document.createElement('div');holder.innerHTML=leaderboardHTML();
    const newWrap=holder.querySelector('.leaderboard-wrap');
    const oldWrap=screen.querySelector('.leaderboard-wrap');
    if(oldWrap&&newWrap)oldWrap.replaceWith(newWrap);
   }
  }
  cleanup();
 };
 script.onerror=cleanup;
 script.src=APPS_SCRIPT_URL+'?action=list&callback='+encodeURIComponent(callbackName)+'&_='+Date.now();
 document.head.appendChild(script);
 setTimeout(cleanup,12000);
}

const q1=[['ꦲ',['Ha','Na','Ca','Ra'],'Ha'],['ꦤ',['Ca','Na','Ka','Ra'],'Na'],['ꦕ',['Ra','Ka','Ca','Da'],'Ca'],['ꦫ',['Ra','Ha','Na','Ta'],'Ra'],['ꦏ',['Ca','Ka','Sa','Wa'],'Ka'],['ꦢ',['La','Ta','Da','Ra'],'Da'],['ꦠ',['Sa','Ta','Wa','Ha'],'Ta'],['ꦱ',['Na','La','Sa','Ka'],'Sa'],['ꦮ',['Wa','Ca','Da','Ha'],'Wa'],['ꦭ',['Ra','La','Sa','Ta'],'La']];
const q2=[['HA',['ꦲ','ꦤ','ꦕ','ꦫ'],'ꦲ'],['NA',['ꦕ','ꦤ','ꦏ','ꦫ'],'ꦤ'],['CA',['ꦫ','ꦏ','ꦕ','ꦢ'],'ꦕ'],['RA',['ꦫ','ꦲ','ꦤ','ꦠ'],'ꦫ'],['KA',['ꦕ','ꦏ','ꦱ','ꦮ'],'ꦏ'],['DA',['ꦭ','ꦠ','ꦢ','ꦫ'],'ꦢ'],['TA',['ꦱ','ꦠ','ꦮ','ꦲ'],'ꦠ'],['SA',['ꦤ','ꦭ','ꦱ','ꦏ'],'ꦱ'],['WA',['ꦮ','ꦕ','ꦢ','ꦲ'],'ꦮ'],['LA',['ꦫ','ꦭ','ꦱ','ꦠ'],'ꦭ']];

const q4=[['PA',['ꦥ','ꦝ','ꦗ','ꦪ'],'ꦥ'],['DHA',['ꦩ','ꦝ','ꦚ','ꦒ'],'ꦝ'],['JA',['ꦪ','ꦧ','ꦗ','ꦛ'],'ꦗ'],['YA',['ꦪ','ꦥ','ꦔ','ꦩ'],'ꦪ'],['NYA',['ꦒ','ꦚ','ꦝ','ꦧ'],'ꦚ'],['MA',['ꦛ','ꦗ','ꦩ','ꦥ'],'ꦩ'],['GA',['ꦒ','ꦔ','ꦪ','ꦚ'],'ꦒ'],['BA',['ꦝ','ꦧ','ꦗ','ꦛ'],'ꦧ'],['THA',['ꦩ','ꦥ','ꦛ','ꦔ'],'ꦛ'],['NGA',['ꦔ','ꦚ','ꦒ','ꦪ'],'ꦔ']];
const q5=[['ꦧꦠ',['Bata','Gaga','Lara','Kaca'],'Bata'],['ꦩꦠ',['Mata','Rasa','Mala','Raga'],'Mata'],['ꦱꦥ',['Sapa','Bata','Dada','Kaca'],'Sapa'],['ꦫꦱ',['Rasa','Raga','Baba','Mala'],'Rasa'],['ꦏꦕ',['Kaca','Lara','Mata','Gaga'],'Kaca'],['ꦭꦫ',['Lara','Bata','Sapa','Rasa'],'Lara'],['ꦢꦢ',['Dada','Gaga','Kaca','Raga'],'Dada'],['ꦒꦒ',['Gaga','Baba','Mata','Bata'],'Gaga'],['ꦫꦒ',['Raga','Rasa','Lara','Sapa'],'Raga'],['ꦩꦭ',['Mala','Mata','Kaca','Dada'],'Mala']];
const state={page:'home',history:[],name:localStorage.getItem('sc_name')||'Kanca Sinau',scores:[0,0,0,0,0],correct:[0,0,0,0,0],wrong:[0,0,0,0,0],unlocked:[true,false,false],musicOn:true,musicVol:.35,voiceVol:.9,questionSet:[],qIndex:0,answered:false,currentSet:0,level:0,teacherOpen:false,teacherAction:false,timer:null,seconds:15,feedback:''};
const $=id=>document.getElementById(id), screen=$('screen'), topbar=$('topbar');
function total(){return state.scores.reduce((a,b)=>a+b,0)}function right(){return state.correct.reduce((a,b)=>a+b,0)}function wrong(){return state.wrong.reduce((a,b)=>a+b,0)}function stars(){return reward()}function reward(){let s=total();if(s>=900)return 5;if(s>=800)return 4;if(s>=700)return 3;if(s>=600)return 2;if(s>=500)return 1;return 0}

function show(html,page){if(state.timer){clearInterval(state.timer);state.timer=null}state.page=page;screen.className='screen '+page+(page==='final'?' final-screen':'');screen.innerHTML=html+`<div class="page-footer">Mufidatul inayah</div>`;topbar.hidden=['home'].includes(page);updateTop();}

function toggleMusic(){state.musicOn=!state.musicOn;if(state.musicOn){playBg(currentMusic());toast('Musik diuripake')}else{$('bgm').pause();toast('Musik dipateni')}updateTop()}
function currentMusic(){return ({home:'pembukaan.mp3',objectives:'tujuan.mp3',instructions:'musik semangat.mp3',song:'tujuan.mp3',map:'menuutama.mp3',material1:'level1.mp3',material2:'level2.mp3',material3:'level3.mp3',score1:'level1.mp3',score2:'level2.mp3',final:'tepuktanganpanjang.mp3'})[state.page]||'menuutama.mp3'}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function go(page){state.history.push(state.page);render(page)}function goBack(){if(state.history.length){const p=state.history.pop();render(p)}else render('map')}
function editName(){const n=prompt('Sapa jenengmu?',state.name);if(n&&n.trim()){state.name=n.trim().slice(0,24);localStorage.setItem('sc_name',state.name);updateTop();toast('Jeneng kasil kasimpen')}}
function render(page){switch(page){case'home':home();break;case'objectives':objectives();break;case'instructions':instructions();break;case'song':song();break;case'map':mapPage();break;case'material1':material(1);break;case'example11':example(1,1);break;case'quiz11':startQuiz(1,1);break;case'example12':example(1,2);break;case'quiz12':startQuiz(1,2);break;case'score1':scoreLevel(1);break;case'material2':material(2);break;case'example21':example(2,1);break;case'quiz21':startQuiz(2,1);break;case'example22':example(2,2);break;case'quiz22':startQuiz(2,2);break;case'score2':scoreLevel(2);break;case'material3':material(3);break;case'example3':example(3,1);break;case'quiz3':startQuiz(3,1);break;case'final':finalPage();break;case'settings':settings();break;case'locks':locksPage();break;default:home()}}
function home(){show(`<div class="hero home"><div><p class="sub">Sugeng Rawuh!</p><h1>SI CAKRAWALA</h1><p class="sub">Sinau Maca Aksara Jawa Lancar</p><p>Ayo njelajah budaya Jawa lan sinau maca aksara Jawa!</p><button class="btn gold" onclick="go('objectives')">AYO WIWITI</button></div><img class="guide" src="${asset('kartunjawa.png')}" alt="Kartun Jawa"></div>`,'home');playBg('pembukaan.mp3')}
function objectives(){
 const tujuan=['Bocah bisa ngenali, nyebutake jeneng, lan ngucapake 20 aksara dhasar Hanacaraka kanthi bener.','Bocah bisa maca tembung nganggo aksara Jawa lan sandhangan kanthi trep.','Bocah bisa maca ukara prasaja nganggo aksara Jawa kanthi lancar.'];
 show(`<h2>Tujuwan Pasinaon</h2><div class="cards">${tujuan.map((x,i)=>`<div class="card"><strong>Tujuwan ${i+1}</strong><p>${x}</p></div>`).join('')}</div>${guide()}<div><button class="btn light" onclick="goBack()">Mbalik</button><button class="btn" onclick="go('instructions')">Sabanjure</button></div>`,'objectives');playBg('tujuan.mp3')}


function instructions(){const rules=['Wacanen materi kanthi premati.','Klik aksara Jawa kanggo ngrungokake swarane.','Wacanen tuladha pitakon sadurunge dolanan.','Pilih salah siji wangsulan sing paling trep.','Saben wangsulan bener oleh 20 skor.','Wangsulan kliru ora oleh skor.','Rampungna tantangan supaya bisa mbukak level sabanjure.','Gatekna wektune nalika dolanan ing level 3.'];show(`<h2>Pituduh lan Tata Cara Dolanan</h2><div class="cards">${rules.map((x,i)=>`<div class="card"><strong>${i+1}.</strong>${x}</div>`).join('')}</div>${guide()}<button class="btn light" onclick="goBack()">Mbalik</button><button class="btn" onclick="go('song')">Sabanjure</button>`,'instructions');playBg('musik semangat.mp3')}

function playSong(){playBg('');playSound('laguaksarajawa.mp3');$('sfx').loop=true}function stopSong(){$('sfx').pause();$('sfx').loop=false;playBg('menuutama.mp3')}
function saveStudentName(value){state.name=value.trim().slice(0,24);localStorage.setItem('sc_name',state.name);updateTop()}

function mapPage(){state.name='';localStorage.removeItem('sc_name');updateTop();show(`<h2>Peta Lelakon</h2><p>Pilihen papan dolananmu. Rampungna saben tantangan supaya dalan sabanjure kabukak.</p><div class="name-panel"><label for="studentName"><strong>Jeneng siswa:</strong></label><input type="text" id="studentName" maxlength="24" placeholder="Ketik jenengmu ing kene..." value="" oninput="saveStudentName(this.value)"></div>${guide()}<div class="levelmap"><div class="level"><div class="emoji">🌱</div><h3>Level 1</h3><p>Pangenalan Aksara Jawa</p><span class="badge">Kabukak</span><br><button class="btn" onclick="enterLevel('material1')">Miwiti</button></div><div class="level ${state.unlocked[1]?'':'locked'}"><div class="emoji">${state.unlocked[1]?'🌳':'🔒'}</div><h3>Level 2</h3><p>Maca Tembung nganggo Sandhangan</p><span class="badge">${state.unlocked[1]?'Kabukak':'Dikunci'}</span><br><button class="btn" ${state.unlocked[1]?'':'disabled'} onclick="enterLevel('material2')">Miwiti</button></div><div class="level ${state.unlocked[2]?'':'locked'}"><div class="emoji">${state.unlocked[2]?'🏆':'🔒'}</div><h3>Level 3</h3><p>Maca Ukara Prasaja</p><span class="badge">${state.unlocked[2]?'Kabukak':'Dikunci'}</span><br><button class="btn" ${state.unlocked[2]?'':'disabled'} onclick="enterLevel('material3')">Miwiti</button></div></div><button class="btn light" onclick="openSettings()">Setelan</button>`,'map');playBg('menuutama.mp3')}

function material(level){
 const list=level===1?aksara.slice(0,10):level===2?aksara.slice(10):aksara;
 const title=level===1?'Sinau Aksara Jawa':level===2?'Sinau Aksara Jawa Lanjutan':'Sinau Maca Ukara';

function example(level,game){let html='';
 if(level===1&&game===1)html=`<div class="question"><p>Wacanen aksara iki!</p>${aksaraView('ꦲ')}<div class="choices">${['Ha','Na','Ca','Ra'].map(x=>`<div class="choice">${x}</div>`).join('')}</div><b>Wangsulan sing trep yaiku Ha.</b></div>`;
 else if(level===1&&game===2)html=`<div class="question"><p>Tulisan Latin: <b>HA</b></p><div class="choices">${['ꦲ','ꦤ','ꦕ','ꦫ'].map(x=>`<div class="choice">${aksaraView(x,'script smallscript')}</div>`).join('')}</div><b>Wangsulan sing trep yaiku ꦲ.</b></div>`;
 else if(level===2&&game===1)html=`<div class="question"><p>Wacanen aksara iki!</p>${aksaraView('ꦥ')}<div class="choices">${['Pa','Dha','Ja','Ya'].map(x=>`<div class="choice">${x}</div>`).join('')}</div><b>Wangsulan sing trep yaiku Pa.</b></div>`;
 else if(level===2)html=`<div class="question"><p>Tulisan Latin: <b>PA</b></p><div class="choices">${['ꦥ','ꦝ','ꦗ','ꦪ'].map(x=>`<div class="choice">${aksaraView(x,'script smallscript')}</div>`).join('')}</div><b>Wangsulan sing trep yaiku ꦥ.</b></div>`;
 else html=`<div class="question"><div class="word">${aksaraLineView('ꦧꦠ')}</div><div class="choices">${['Bata','Gaga','Lara','Kaca'].map(x=>`<div class="choice">${x}</div>`).join('')}</div><b>Wangsulan sing trep yaiku Bata.</b></div>`;
 let next=level===1?(game===1?'quiz11':'quiz12'):level===2?(game===1?'quiz21':'quiz22'):'quiz3';show(`<h2>Tuladha Pitakon</h2>${html}<button class="btn" onclick="go('${next}')">${level===3?'Miwiti Dolanan':game===2?'Miwiti Dolanan Kapindho':'Miwiti Dolanan'}</button>`,'example'+level+game);playBg('level'+level+'.mp3')}

function startQuiz(level,game){let set=level===1?(game===1?q1:q2):level===2?(game===1?q3:q4):q5;state.level=level;state.currentSet=(level===1?game-1:level===2?game+1:4);state.questionSet=set;state.qIndex=0;state.answered=false;state.feedback='';quizPage();}
function quizPage(){const q=state.questionSet[state.qIndex],level=state.level,game=state.currentSet;let isLatin=(level===1&&game===0)||(level===2&&game===2);let prompt=q[0],opts=q[1],timed=level===3&&state.qIndex>=5;
 let promptHtml;
 // Soal Level 1: tampilkan Ra langsung dari aset GitHub, bukan glyph Unicode.
 if(level===1 && prompt==='ꦫ'){
  promptHtml=`<img src="${asset('gambarra.jpg')}" class="aksara-gambar aksara-ra-soal" alt="Aksara Ra" loading="eager" decoding="async">`;
 }else if(isLatin){
  promptHtml=`<div class="script">${prompt}</div>`;
 }else if(level===3){
  promptHtml=`<div class="word">${aksaraLineViewLevel3(prompt)}</div>`;
 }else{
  promptHtml=aksaraView(prompt,'script soal-gambar');
 }
 const shuffled=[...opts];for(let j=shuffled.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[shuffled[j],shuffled[k]]=[shuffled[k],shuffled[j]];}state.displayOptions=shuffled;let pilihanHtml=shuffled.map((o,i)=>{const isGlyph=aksara.some(a=>a[0]===o);return `<button class="choice ${isLatin&& !isGlyph?'script smallscript':''}" onclick="answerQuestion(${i})">${isGlyph?aksaraView(o,'script smallscript'):o}</button>`}).join('');
 show(`<div class="stats"><span class="stat">Soal ${state.qIndex+1} / 10</span><span class="stat">Skor: ${state.scores[game]}</span>${timed?`<span class="stat" id="timer">⏱ ${state.seconds}</span>`:''}</div><div class="progress"><span style="width:${state.qIndex*10}%"></span></div><h2>${level===3?'Maca Ukara':'Pilihen Wangsulan sing Trep'}</h2><div class="question"><p>${isLatin?'Pilihen aksara Jawa sing trep!':level===3?'Wacanen tembung iki!':'Wacanen aksara Jawa iki!'}</p>${promptHtml}</div><div class="choices">${pilihanHtml}</div><div class="feedback" id="feedback">${state.feedback}</div><p class="footer-note">Wangsulan bener oleh 20 skor. Wangsulan kliru ora oleh skor.</p>`,'quiz');playBg('level'+level+'.mp3');if(timed)startTimer()}

function startTimer(){state.seconds=15;let el=$('timer');if(el)el.textContent='⏱ 15';state.timer=setInterval(()=>{state.seconds--;let t=$('timer');if(t)t.textContent='⏱ '+state.seconds;if(state.seconds<=0){clearInterval(state.timer);state.timer=null;if(!state.answered)answerQuestion(-1,true)}},1000)}
function answerQuestion(index,timeout=false){if(state.answered)return;state.answered=true;if(state.timer){clearInterval(state.timer);state.timer=null}const q=state.questionSet[state.qIndex],game=state.currentSet,shown=state.displayOptions||q[1],correct=index>=0&&shown[index]===q[2];let buttons=[...screen.querySelectorAll('.choice')];if(index>=0&&buttons[index])buttons[index].classList.add(correct?'correct':'wrong');buttons.forEach((b,i)=>{if(shown[i]===q[2])b.classList.add('correct');b.disabled=true});if(correct){state.scores[game]+=20;state.correct[game]++;state.feedback='Pinter! Wangsulanmu Bener!';playSound('jawabanbenar.mp3')}else{state.wrong[game]++;state.feedback=(timeout?'Wektune entek. ':'Durung bener. ')+'Wangsulan sing trep yaiku '+q[2]+'.';playSound('jawabansalah.mp3')}let f=$('feedback');if(f)f.textContent=state.feedback;updateTop();setTimeout(()=>{state.qIndex++;if(state.qIndex<10){state.answered=false;quizPage()}else finishSet()},1450)}
function finishSet(){if(state.level===1&&state.currentSet===0){go('example12')}else if(state.level===1){go('score1')}else if(state.level===2&&state.currentSet===2){go('example22')}else if(state.level===2){go('score2')}else go('final')}
function scoreLevel(level){let ix=level===1?[0,1]:[2,3],sc=ix.reduce((a,i)=>a+state.scores[i],0),co=ix.reduce((a,i)=>a+state.correct[i],0),wr=ix.reduce((a,i)=>a+state.wrong[i],0);let pass=level===1?sc>=280:co>=14;if(level===1&&pass)state.unlocked[1]=true;if(level===2&&pass)state.unlocked[2]=true;let msg=level===1?(pass?'Sugeng! Kowe Wis Bisa Mbukak Level 2!':'Ayo Sinau Maneh Supaya Bisa Mbukak Level 2!'):(pass?'Apik! Kowe Wis Bisa Mbukak Level 3!':'Ayo Semangat Maneh! Sinaua Supaya Bisa Mbukak Level 3!');let next=level===1?'material2':'material3';show(`<h2>Skor Level ${level}</h2><div class="cards"><div class="card"><strong>Dolanan 1</strong>${state.scores[ix[0]]} skor</div><div class="card"><strong>Dolanan 2</strong>${state.scores[ix[1]]} skor</div><div class="card"><strong>Gunggung Skor</strong><h2>${sc}</h2></div><div class="card"><strong>Wangsulan Bener</strong>${co}</div><div class="card"><strong>Wangsulan Kliru</strong>${wr}</div></div><h2>${msg}</h2>${pass?`<button class="btn gold" onclick="go('${next}')">Terusake Level ${level+1}</button>`:`<button class="btn" onclick="go('${level===1?'map':'material2'}')">${level===1?'Mbalik menyang Peta':'Mbalik menyang Level 2'}</button>`}<p><button class="btn light" onclick="resetProgress()">Mbalik menyang Peta (Baleni Progres)</button></p>`,'score'+level);playBg('level'+level+'.mp3');saveResult('level'+level)}
function finalPage(){let s=total(),r=reward();recordLeaderboard();let rank=currentPlayerRank(),trophy=rank>0&&rank<=3;let msg=s>=900?'Hebat! Kowe Entuk Lima Lintang!':s>=700?'Pinter! Terusna Semangat Sinau!':s>=500?'Apik! Terusna Latihan!':'Aja Gampang Nyerah, Ayo Sinau Maneh!';show(`<h2>Sugeng! Petualanganmu Wis Rampung!</h2><div class="badge">⭐ ${r} Lintang${trophy?' · '+trophyForRank(rank):''}</div><div class="cards"><div class="card"><strong>Jeneng Siswa</strong>${escapeHTML(state.name)}</div><div class="card"><strong>Skor Level 1</strong>${state.scores[0]+state.scores[1]}</div><div class="card"><strong>Skor Level 2</strong>${state.scores[2]+state.scores[3]}</div><div class="card"><strong>Skor Level 3</strong>${state.scores[4]}</div><div class="card"><strong>Gunggung Skor</strong><h2>${s} / 1.000</h2></div><div class="card"><strong>Wangsulan Bener</strong>${right()}</div><div class="card"><strong>Wangsulan Kliru</strong>${wrong()}</div></div><h2>${msg}</h2><p>${'⭐ '.repeat(r)}${trophy?' '+trophyForRank(rank):''}</p>${leaderboardHTML()}<button class="btn gold" onclick="newGame()">Dolanan Maneh</button>`,'final');playBg('tepuktanganpanjang.mp3');saveResult('final')}

function clearScores(){state.scores=[0,0,0,0,0];state.correct=[0,0,0,0,0];state.wrong=[0,0,0,0,0];state.unlocked=[true,false,false];state.name='';localStorage.removeItem('sc_name');updateTop()}
function resetProgress(){clearScores();state.history=[];render('map');toast('Progres wis direset. Tulisen jeneng maneh.')}
function resetAll(){if(!confirm('Apa kowe yakin arep mbusak kabeh skor lan kemajuan dolanan?'))return;clearScores();state.history=[];render('map');toast('Kabeh progres wis direset. Tulisen jeneng maneh.')}
function newGame(){clearScores();state.history=[];render('home');toast('Dolanan anyar. Jeneng bakal diketik maneh.')}
function openSettings(){go('settings')}
function settings(){show(`<h2>Setelan</h2><div class="settings"><label>Swara Musik Latar: <span id="mv">${Math.round(state.musicVol*100)}%</span><input type="range" min="0" max="100" value="${state.musicVol*100}" oninput="setVolume('music',this.value)"></label><label>Swara Paraga: <span id="vv">${Math.round(state.voiceVol*100)}%</span><input type="range" min="0" max="100" value="${state.voiceVol*100}" oninput="setVolume('voice',this.value)"></label><hr><h3>Kunci Level</h3><p>Ketik sandhi guru, banjur pencet Enter kanggo nampilake tombol.</p><input type="password" id="teacherPass" placeholder="Sandhi guru" onkeydown="if(event.key==='Enter'){verifyTeacher('check')}"><button class="btn" onclick="verifyTeacher('check')">Priksa Sandhi</button><div id="lockActions" class="row hidden"><button class="btn" onclick="verifyTeacher('unlock')">Bukak Level 2 lan 3</button><button class="btn danger" onclick="verifyTeacher('lock')">Kunci Level 2 lan 3</button><button class="btn danger" onclick="clearLeaderboard()">Busak Papan Skor</button></div><p class="footer-note">Tombol bakal katon yen sandhi bener.</p></div><button class="btn light" onclick="goBack()">Mbalik</button>`,'settings');playBg(currentMusic())}
function setVolume(which,v){let n=Number(v)/100;if(which==='music'){state.musicVol=n;$('mv').textContent=v+'%';$('bgm').volume=n}else{state.voiceVol=n;$('vv').textContent=v+'%';$('sfx').volume=n}}
let clearingLeaderboardNow = false;

async function clearLeaderboard(){
 if(clearingLeaderboardNow)return;
 if(!confirm('Apa sampeyan yakin arep mbusak KABEH data papan skor saka Google Sheets lan piranti iki? Data kemajuan level ora diowahi.'))return;
 const password=prompt('Lebokna sandhi guru kanggo mbusak papan skor:');
 if(password===null)return;
 if(password!==PASSWORD_GURU){alert('Sandhi guru salah. Data ora dibusak.');return;}

 clearingLeaderboardNow=true;
 const btns=[...screen.querySelectorAll('button')];
 btns.forEach(b=>b.disabled=true);
 toast('Ngirim prentah mbusak menyang Google Sheets...');

 try{
  // Backend Apps Script menerima JSON dengan action:"reset".
  // Password diverifikasi kembali di server melalui ADMIN_PASSWORD_SHA256.
  await fetch(APPS_SCRIPT_URL,{
   method:'POST',
   headers:{'Content-Type':'text/plain;charset=UTF-8'},
   body:JSON.stringify({action:'reset',password:password})
  });

  // no-cors bisa menyembunyikan respons POST; verifikasi dilakukan dengan
  // membaca ulang daftar skor melalui endpoint JSONP action=list.
  const result=await verifyLeaderboardEmpty(8);
  if(result.ok&&result.total===0){
   localStorage.removeItem('sc_leaderboard');
   sharedLeaderboard=[];
   if(state.page==='leaderboard'||state.page==='final')showLeaderboard();
   toast('Papan skor Google Sheets kasil dikosongake.');
  }else{
   sharedLeaderboard=null;
   if(state.page==='leaderboard'||state.page==='final')loadSharedLeaderboard();
   alert('Server isih nuduhake '+result.total+' data. Priksa sandhi admin ing Apps Script, deployment Web App, lan URL ing HTML.');
  }
 }catch(error){
  console.error('Gagal mbusak papan skor:',error);
  alert('Penghapusan durung bisa diverifikasi. Priksa sandhi admin ing Apps Script, deployment Web App, URL, lan sambungan internet.');
 }finally{
  btns.forEach(b=>b.disabled=false);
  clearingLeaderboardNow=false;
 }
}

function verifyLeaderboardEmpty(maxAttempts=8){
 return new Promise((resolve,reject)=>{
  let attempts=0;
  function check(){
   attempts++;
   const callbackName='siCakrawalaClearCheck_'+Date.now()+'_'+Math.floor(Math.random()*100000);
   const script=document.createElement('script');
   let finished=false;
   const timeout=setTimeout(retry,7000);
   const cleanup=()=>{if(finished)return;finished=true;clearTimeout(timeout);try{delete window[callbackName]}catch(e){window[callbackName]=undefined}if(script.parentNode)script.parentNode.removeChild(script)};
   function retry(){cleanup();if(attempts<maxAttempts)setTimeout(check,700);else reject(new Error('Server ora menehi data ranking sing valid.'));}
   window[callbackName]=function(data){
    cleanup();
    if(data&&data.ok&&(Array.isArray(data.scores)||Array.isArray(data.ranking))){
     const rows=Array.isArray(data.scores)?data.scores:data.ranking;
     if(rows.length===0){resolve({ok:true,total:0});return;}
     if(attempts<maxAttempts){setTimeout(check,700);return;}
     resolve({ok:true,total:rows.length});return;
    }
    if(attempts<maxAttempts)setTimeout(check,700);else reject(new Error('Data skor saka server ora valid.'));
   };
   script.onerror=retry;
   script.src=APPS_SCRIPT_URL+'?action=list&callback='+encodeURIComponent(callbackName)+'&_='+Date.now();
   document.head.appendChild(script);
  }
  check();
 });
}
function verifyTeacher(action){let p=$('teacherPass').value;if(p!==PASSWORD_GURU){toast('Sandhi kliru!');$('lockActions').classList.add('hidden');$('teacherPass').value='';return}if(action==='check'){ $('lockActions').classList.remove('hidden');toast('Sandhi bener. Pilih prentahmu.');return }if(action==='unlock'){state.unlocked=[true,true,true];toast('Level 2 lan 3 wis kabukak')}else if(action==='lock'){state.unlocked=[true,false,false];toast('Level 2 lan 3 wis dikunci')} $('lockActions').classList.add('hidden');$('teacherPass').value='';updateTop()}
function showLocks(){go('locks')}
function locksPage(){show(`<h2>Status Kunci Level</h2><div class="cards">${state.unlocked.map((v,i)=>`<div class="card"><strong>Level ${i+1}</strong>${v?'🔓 Kabukak':'🔒 Dikunci'}</div>`).join('')}</div><p>Level 1 tansah kabukak. Level sabanjure kudu dirampungake utawa dibukak dening guru.</p><button class="btn" onclick="goBack()">Mbalik</button>`,'locks')}
async function saveResult(stage){
 const scoreData={
  name:state.name,stage,score:total(),scores:state.scores,correct:right(),
  wrong:wrong(),stars:reward(),time:new Date().toISOString()
 };
 try{
  localStorage.setItem('siCakrawalaProgress',JSON.stringify(scoreData));
  if(APPS_SCRIPT_URL){
   try{
    await fetch(APPS_SCRIPT_URL,{
     method:'POST',
     mode:'no-cors',
     headers:{'Content-Type':'text/plain;charset=UTF-8'},
     body:JSON.stringify({action:'save',score:scoreData})
    });
   }catch(e){console.warn('Skor durung bisa dikirim menyang Google Sheets',e)}
   if(stage==='final')setTimeout(loadSharedLeaderboard,1200);
  }
 }catch(e){console.warn('Panyimpenan lokal gagal',e)}
}
// Pulihake jeneng lan skor ringkes yen kaca dibukak maneh. Dolanan anyar diwiwiti saka pambuka.
updateTop();render('home');
</script></body></html>
